# Chaashini dashboard as the port-80 default server.
#
# Installed by deploy/install_nginx.sh ONLY when no other default server exists on the box (e.g. after the
# container was re-created). Other services that later need port 80 can either add their own `location`
# blocks to this file, drop files into /etc/nginx/chaashini-extra/ (included below), or replace this file
# with their own default server and append deploy/nginx/chaashini-dashboard.location to it.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    charset utf-8;

    location ^~ /chaashini/ {
        proxy_pass http://127.0.0.1:8978/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Prefix /chaashini;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location = /chaashini { return 301 /chaashini/; }
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
    location = / { return 302 /chaashini/; }

    include /etc/nginx/chaashini-extra/*.conf;
}
