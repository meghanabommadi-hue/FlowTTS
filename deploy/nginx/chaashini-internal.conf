# Chaashini internal API for the GPU box workers.
#
# Standalone server block on port 80 selected by Host header (GPU box -> CPU box only
# reaches ports 22/80). Its own file, so provisioning of other services' site files
# cannot remove it. Nothing here is served for the default Host, so the existing
# default_server keeps behaving exactly as before.
server {
    listen 80;
    listen [::]:80;
    server_name chaashini-internal;

    client_max_body_size 4g;          # ASR/enhance result tars
    proxy_request_buffering off;
    proxy_buffering off;

    location /internal/ {
        proxy_pass http://127.0.0.1:8978;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 10s;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8978/healthz; }
    location / { return 404; }

    access_log /var/log/nginx/chaashini-internal.access.log;
    error_log  /var/log/nginx/chaashini-internal.error.log;
}
