# FlowTTS / OmniVoice — dedicated nginx server block.
#
# ADDITIVE: its own port, its own upstreams, its own log files. No existing
# server block, server_name or location is modified by this file.
#
#   :8090/            REST + OpenAI-compatible speech API   (127.0.0.1:9000)
#   :8090/ws          WebSocket gateway                     (127.0.0.1:9000/ws)
#   :8090/ws-raw      raw-port WebSocket, legacy clients    (127.0.0.1:9080)
#   :8090/ctrl/       control API (healthz/readyz/stats)    (127.0.0.1:9764)
#
# Installed as /etc/nginx/conf.d/omnivoice.conf. It replaces the identically
# shaped dhvaani.conf, which pointed at these same ports for a service that has
# been stopped — leaving it in place would have silently served OmniVoice under
# the DhVaani name.

upstream omnivoice_http { server 127.0.0.1:9000; keepalive 64; }
upstream omnivoice_ws   { server 127.0.0.1:9080; }
upstream omnivoice_ctrl { server 127.0.0.1:9764; }

map $http_upgrade $omnivoice_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8090;
    server_name _;

    # Voice-clone reference clips arrive as multipart uploads.
    client_max_body_size 64m;

    access_log /var/log/nginx/omnivoice.access.log;
    error_log  /var/log/nginx/omnivoice.error.log warn;

    location / {
        proxy_pass http://omnivoice_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streaming synthesis is the entire point of this service. With
        # buffering on, nginx holds the audio until the response completes and
        # time-to-first-byte becomes time-to-last-byte. These four lines are
        # what make /v1/tts/stream actually stream.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # WebSocket on the HTTP port (FastAPI route). This is the path to use.
    location /ws {
        proxy_pass http://omnivoice_http;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $omnivoice_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        # A voice-bot socket sits idle between utterances; do not cut it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The raw-port WebSocket listener, for clients written against the old
    # server that connect to a bare port rather than a path.
    location /ws-raw {
        proxy_pass http://omnivoice_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $omnivoice_connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ctrl/ {
        proxy_pass http://omnivoice_ctrl/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
}
