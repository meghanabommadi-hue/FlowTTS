# Chaashini dashboard - standalone listener (for office/VPN access on a dedicated port).
server {
    listen 8979;
    listen [::]:8979;
    server_name _;
    location / {
        proxy_pass http://127.0.0.1:8978/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    access_log /var/log/nginx/chaashini.access.log;
    error_log  /var/log/nginx/chaashini.error.log;
}
