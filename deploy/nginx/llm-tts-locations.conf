# Location blocks appended to the existing /etc/nginx/sites-enabled/llm server
# block (listen 80; server_name 101.53.141.123), which already namespaces other
# services the same way — /v1/ for Gemma, /xlit/ for transliteration.
#
# Port 80 is the only externally reachable HTTP port on this host, so these are
# what external callers actually use:
#
#   http://101.53.141.123/tts/healthz
#   http://101.53.141.123/tts/docs                  OpenAPI browser
#   http://101.53.141.123/tts/v1/tts                synthesize
#   http://101.53.141.123/tts/v1/tts/stream         streaming synthesize
#   http://101.53.141.123/tts/v1/audio/speech       OpenAI-compatible
#   http://101.53.141.123/tts/v1/voices             voice CRUD + cloning
#   ws://101.53.141.123/tts/ws                      WebSocket
#
# /dhvaani/ is kept as an alias onto the same upstream: that service is stopped
# and its ports are now this one's, so any integration still calling the old
# path reaches a working TTS service rather than a 502.

location /tts/ws {
    proxy_pass http://127.0.0.1:9000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /tts/ {
    proxy_pass http://127.0.0.1:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Without these three, streaming synthesis is buffered and TTFB becomes
    # time-to-last-byte.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    client_max_body_size 64m;
}

location /dhvaani/ws {
    proxy_pass http://127.0.0.1:9000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /dhvaani/ {
    proxy_pass http://127.0.0.1:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    client_max_body_size 64m;
}
