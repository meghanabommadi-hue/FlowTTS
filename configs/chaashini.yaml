# Chaashini orchestrator configuration (CPU box). Secrets live in configs/local.yaml or env:
#   HF_TOKEN, CHAASHINI_INTERNAL_TOKEN, LLM_API_KEY
paths:
  root: /opt/chaashini

llm:
  base_url: https://models.kapturecrm.com/llm/bolt-surge/v1
  model: bolt-surge
  temperature: 0.9
  max_tokens: 2500

hf:
  repo_id: kapturecx/Chaashini
  dataset_name: Chaashini
  push_every_hours: 10          # push once this many hours of NEW accepted audio are staged
  push_check_interval_s: 300
  shard_target_mb: 400

source:
  search_results_per_query: 40
  min_duration_s: 240
  max_duration_s: 7200             # 2 h cap: diarization memory grows with file length on a shared GPU
  max_videos_per_channel: 80
  download_concurrency: 8
  cookies_file: /opt/chaashini/app/configs/cookies.txt  # optional; export from a logged-in browser to lift bot-checks
  cookies_dir: /opt/chaashini/app/configs/cookies       # optional; one cookies file per throw-away account, rotated across workers
  proxy: ""                                            # optional; rotating residential proxy for scale
  proxies: []                                          # optional; paired by index with the cookie files
  rate_limit: ""                                       # e.g. 10M
  sleep_requests: 0.5
  sleep_interval: 1.0
  cooldown_base_s: 300
  cooldown_max_s: 3600

# Target languages. weight = share of discovery effort.
languages:
  - {code: hi, weight: 3.0}
  - {code: bn, weight: 2.0}
  - {code: ta, weight: 2.0}
  - {code: te, weight: 2.0}
  - {code: mr, weight: 2.0}
  - {code: gu, weight: 1.5}
  - {code: kn, weight: 1.5}
  - {code: ml, weight: 1.5}
  - {code: pa, weight: 1.2}
  - {code: or, weight: 1.0}
  - {code: as, weight: 0.8}
  - {code: bho, weight: 0.8}
  - {code: mai, weight: 0.5}
  - {code: ne, weight: 0.5}
  - {code: sa, weight: 0.3}
  - {code: kok, weight: 0.3}
  - {code: doi, weight: 0.2}
  - {code: brx, weight: 0.2}
  - {code: mni, weight: 0.2}
  - {code: sat, weight: 0.2}
  - {code: sd, weight: 0.2}
  - {code: raj, weight: 0.4}
  - {code: hne, weight: 0.3}
  - {code: awa, weight: 0.2}
  - {code: mag, weight: 0.2}
  - {code: bgc, weight: 0.2}
  - {code: en, weight: 0.8}          # Indian English
  - {code: ur, weight: 0.0, enabled: false}   # ASR does not support Urdu / Kashmiri yet
  - {code: ks, weight: 0.0, enabled: false}

discovery:
  queries_per_language_per_round: 12
  target_backlog_videos: 300
  round_sleep_s: 120
  channel_expand_min_accept_ratio: 0.35
  channel_expand_min_videos: 2
  channel_expand_max_items: 60
  seed_channel_playlists: []          # "hi|https://www.youtube.com/playlist?list=..."

audio:
  analysis_sr: 16000
  export_sr: 24000
  export_format: flac
  enhance_input_sr: 44100

vad:
  threshold: 0.5
  hop: 256
  min_speech_ms: 500
  max_chunk_ms: 30000
  target_chunk_ms: 15000
  min_silence_split_ms: 250
  pad_ms: 120
  merge_gap_ms: 200

diar:
  frame_ms: 80
  active_prob: 0.5
  overlap_margin_ms: 250
  min_dominance: 0.9

quality:
  video_music_gate: 0.5        # reject the whole source if >= 50% of sampled windows are music
  video_gate_windows: 24
  accept:                      # a chunk must pass ALL of these
    ovrl_min: 3.0
    sig_min: 3.2
    bak_min: 3.8
    p808_min: 3.0
    music_prob_max: 0.15
    speech_prob_min: 0.5
    snr_db_min: 20.0
    rms_dbfs_min: -40.0
    rms_dbfs_max: -6.0
    clipping_max: 0.001
    bandwidth_hz_min: 4500.0
    vad_ratio_min: 0.6
  enhance:                     # failing chunks inside these bounds get enhanced, then re-scored against `accept`
    enabled: true
    ovrl_min: 2.3
    sig_min: 3.3
    snr_db_min: 8.0
    music_prob_max: 0.3
    max_fraction_per_video: 0.2
    max_chunks_per_video: 60
    min_chunk_ms: 4000
    max_queue_s: 1800
    mode: enhance              # enhance | denoise
    nfe: 16
    solver: midpoint
    lambd: 0.5
    tau: 0.5
  text:
    min_chars: 2
    min_chars_per_sec: 1.2
    max_chars_per_sec: 32.0
    min_lang_conf: 0.55
    min_asr_conf: 0.8

workers:
  discover: 1
  download: 8
  process: 10
  publish: 1
  torch_threads: 4
  cpu_max_percent: 78          # box-wide CPU ceiling; keeps >= 20% free for the other services on this box
  heartbeat_s: 10
  lease_s: 3600
  max_videos_in_flight: 128

api:
  host: 127.0.0.1
  port: 8978
  status_refresh_s: 5

gpu:
  job_lease_s: 2400
  max_attempts: 2

storage:
  min_free_gb: 40
  keep_accepted_samples: 400
  work_ttl_hours: 48

lid:
  prior_weight: 0.15
  code_mix_threshold: 0.15
