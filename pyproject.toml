[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaashini"
version = "0.1.0"
description = "Chaashini: a high-throughput, quality-gated Indian-language speech corpus builder (orchestrator + dashboard)."
requires-python = ">=3.11"
dependencies = [
  "yt-dlp>=2026.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "soundfile>=0.12",
  "scipy>=1.11",
  "librosa>=0.10",
  "onnxruntime>=1.17",
  "ten-vad>=1.0.6",
  "huggingface_hub[hf_transfer]>=0.30",
  "datasets>=3.0",
  "pyarrow>=15",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "tqdm>=4.66",
  "panns-inference>=0.1",
  "psutil>=5.9",
  "python-multipart>=0.0.9",
]

[project.scripts]
chaashini = "chaashini.cli:main"

[tool.setuptools.packages.find]
include = ["chaashini*"]
